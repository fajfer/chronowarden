# Chronowarden Configuration
#
# This file can be used as:
#   - A plain YAML config file (set CHRONOWARDEN_CONFIG env var or place at /etc/chronowarden/config.yaml)
#   - A Kubernetes ConfigMap (mount at /etc/chronowarden/config.yaml)
#   - Part of a Docker/Podman Compose setup (bind mount into container)
#
# Sensitive values (tokens) can be provided via:
#   - token:      literal value (for development only)
#   - token_env:  environment variable name (Docker Compose .env, K8s env from Secret)
#   - token_file: file path (K8s Secret volume mount, Docker secret)
#
# Token resolution priority: token_file > token_env > token

# Global defaults
date_format: "YYYY-MM-DD"  # or "YYYY-DD-MM", with auto-detection fallback
polling_interval: "6h"     # Global polling interval for all vaults (e.g. '6h', '30m')

# Expiry profiles: define rotation periods per severity level
# Supports: d (days), m (months), y (years)
expiry_profiles:
  default:
    rotation_period: "365d"  # 1 year
  critical:
    rotation_period: "6m"    # 6 months (~180 days)
  pci-dss-4.0:
    rotation_period: "90d"   # 90 days

vaults:
  # Production Vault cluster
  - name: production
    address: https://vault.production.example.com:8200
    token_env: VAULT_PRODUCTION_TOKEN
    namespace: app/chronowarden
    mount_path: secret
    verify_ssl: true
    auth_method: token
    # date_format: "YYYY-DD-MM"   # optional per-vault override
    # default_severity: "critical" # optional vault-level default severity

  # Staging Vault (OpenBao fork)
  - name: staging
    address: https://openbao.staging.example.com:8200
    token_file: /run/secrets/staging-vault-token
    mount_path: kv
    verify_ssl: true
    auth_method: token

  # Local development Vault
  - name: dev
    address: http://localhost:8200
    token: hvs.dev-only-token
    mount_path: secret
    verify_ssl: false
    auth_method: token

# Per-engine configuration (auto-discovered from Vault, can be overridden here)
engines:
  # - id: secret/my-app
  #   default_severity: "pci-dss-4.0"  # optional engine-level override
