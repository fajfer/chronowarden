# Chronowarden Configuration
#
# This file can be used as:
#   - A plain YAML config file (set CHRONOWARDEN_CONFIG env var or place at /etc/chronowarden/config.yaml)
#   - A Kubernetes ConfigMap (mount at /etc/chronowarden/config.yaml)
#   - Part of a Docker/Podman Compose setup (bind mount into container)
#
# Validation is strict: unknown keys (typos), severities without an expiry profile, invalid values,
# unparsable YAML, or a CHRONOWARDEN_CONFIG path that does not exist all stop Chronowarden at startup.
#
# Sensitive values (tokens) can be provided via:
#   - token:      literal value (for development only)
#   - token_env:  environment variable name (Docker Compose .env, K8s env from Secret)
#   - token_file: file path (K8s Secret volume mount, Docker secret)
#
# Token resolution priority: token_file > token_env > token
#
# AppRole credentials can be provided via:
#   - role_id / secret_id:         literal values (for development only)
#   - role_id_env / secret_id_env: environment variable names
#   - role_id_file / secret_id_file: file paths (K8s Secret volume mount)
#   - approle_mount_point:         custom auth method mount point (default: "approle")
#
# AppRole resolution priority: *_file > *_env > literal

# Global CA certificates directory (optional)
# All .pem, .crt, and .cert files in this directory will be trusted for all vaults
ca_certs_dir: /etc/chronowarden/certs
sentry_dsn: "https://1337.ingest.de.sentry.io/1337"  # optional Sentry DSN for error reporting
# Sentry sends no PII (request headers, client IPs) and no traces/profiles by default.
# sentry_traces_sample_rate: 0.0    # 0.0-1.0, transaction tracing
# sentry_profiles_sample_rate: 0.0  # 0.0-1.0, profiling
# Global defaults
date_format: "YYYY-MM-DD"  # or "YYYY-DD-MM", with auto-detection fallback
polling_interval: "6h"     # Global polling interval for all vaults (e.g. '6h', '30m')
vault_reconnect_interval: 120  # Seconds between reconnection attempts for offline vaults (minimum 10, default: 120)
vault_reconnect_max_attempts: 5  # Number of reconnect cycles before loop stops (minimum 1, default: 5)
# Until authentication exists, anyone who reaches Chronowarden can trigger these; requests sooner get 429
manual_sync_cooldown: 30   # Seconds before a vault can be synced again from the UI or API (0 = off, default: 30)
snapshot_min_interval: 60  # Seconds between compliance snapshots taken from the UI or API (0 = off, default: 60)

# Compliance evidence (optional). Without cadences you can still take ad-hoc snapshots with a free label in the
# Compliance tab. With cadences, the tab reminds you when a period ended; closing it freezes a snapshot of the
# cadence's scope (empty lists = everything). Periods: monthly, quarterly, half-yearly, yearly.
compliance:
  reporting:
    cadences: []
    # cadences:
    #   - period: quarterly
    #     scope: { systems: [Billing], privileged_only: true }
    #   - period: yearly
    #     scope: {}
  # Policies (optional): controls checked against the inventory, shown in the Compliance tab and in snapshot reports.
  # Example policies for KNF, PCI DSS and DORA are in the docs; they are a starting point, not legal advice.
  policies: []
  # policies:
  #   - id: bank-pam                  # lowercase, used in URLs
  #     name: Internal PAM standard
  #     framework: Internal           # optional, e.g. "PCI DSS 4.0"
  #     version: "2026.1"             # optional
  #     controls:
  #       - id: PAM-01
  #         title: Privileged credentials rotated at least every 90 days
  #         source: PAM standard section 4.2   # optional: where the requirement comes from
  #         # scope (all optional; empty matches every secret): vaults, engines, systems, severities,
  #         # paths (globs on vault/engine/path), privileged (true/false)
  #         scope: { privileged: true }
  #         # rule types: max_rotation_age (days), not_expired, has_owner, has_system, rotation_confirmed
  #         rule: { type: max_rotation_age, days: 90 }
  #         # failing secrets that turn the control amber/red, or amber_pct/red_pct; default: one failure is red
  #         thresholds: { amber: 1, red: 5 }
  #       - id: PAM-02
  #         title: Every privileged credential has an owner
  #         scope: { privileged: true }
  #         rule: { type: has_owner }

# Host names Chronowarden answers to. "*" (default) answers any; listing yours stops other web pages from reaching it
# through DNS rebinding. Cross-site writes from browsers are refused either way.
allowed_hosts: ["*"]
# allowed_hosts: [chronowarden.example.com, "*.internal.example.com"]

# Prometheus metrics at /api/v1/metrics. Off by default since 0.7: turn them on if Prometheus scrapes Chronowarden.
metrics:
  enabled: false

# Instance-wide UI settings (optional)
ui:
  default_theme: default  # "default" or "bison"; falls back to the CHRONOWARDEN_THEME env var, then "default".
                          # Users can still pick their own theme in Settings.

# Expiry profiles: define rotation periods per severity level
# Supports: d (days), m (months), y (years)
# alert_threshold: secrets expiring within this window get the "warning" status (default: 30d)
# Users can override these defaults or add custom profiles
expiry_profiles:
  default:
    rotation_period: "365d"  # 1 year
  critical:
    rotation_period: "6m"    # 6 months (~180 days)
  pci-dss-4.0:
    rotation_period: "90d"   # 90 days
  # Example custom profile:
  # monthly:
  #   rotation_period: "30d"
  #   alert_threshold: "7d"
  #   confirmation_grace: "2d"  # overrides the global confirmation_grace below

# Rotation confirmation (ADR-021): when a secret's rotations must be confirmed as applied where it is used
# (confirmation_required below), a new version shows "awaiting confirmation" until someone confirms it in the UI or
# through POST /api/v1/secrets/{id}/confirmations. It becomes overdue after this grace period.
confirmation_grace: "7d"

# Severity Cascade (highest to lowest priority):
#   1. Secret-specific config (vaults[].engines[].secrets[].severity)
#   2. Engine config (vaults[].engines[].severity)
#   3. Vault config (vaults[].severity)
#   4. Global default ("default" profile / 365 days)
#
# Config is the source of truth - Vault metadata is written by Chronowarden

vaults:
  # Production Vault cluster
  - name: production
    address: https://vault.production.example.com:8200
    token_env: VAULT_PRODUCTION_TOKEN
    namespace: app/chronowarden
    mount_path: secret
    verify_ssl: true
    auth_method: token
    # date_format: "YYYY-DD-MM"  # optional per-vault override

    # Vault-wide default severity (applies to ALL engines automatically)
    severity: critical
    # Rotations must be confirmed as applied: secret → engine → vault, default false
    # confirmation_required: true

    # OPTIONAL: Only list engines that need overrides
    # All discovered engines automatically inherit vault severity
    engines:
      # Override: temporary tokens rotate annually
      - name: temporary-tokens
        severity: default
        # confirmation_required: false  # e.g. rotated by trusted automation

      # Override with specific secret exceptions
      - name: certificates
        severity: pci-dss-4.0

        # Individual secret overrides (highest priority)
        secrets:
          - path: root-ca-key
            severity: none   # Monitor but never rotate
          - path: test-cert
            severity: default  # Less critical
          # A secret entry may set severity, confirmation_required, or both
          # - path: db-password
          #   confirmation_required: true

  # Staging Vault (OpenBao fork)
  - name: staging
    address: https://openbao.staging.example.com:8200
    token_file: /run/secrets/staging-vault-token
    mount_path: kv
    verify_ssl: true
    auth_method: token
    severity: critical

  # Local development Vault
  - name: dev
    address: http://localhost:8200
    token: hvs.dev-only-token
    mount_path: secret
    verify_ssl: false
    auth_method: token
    # Dev vault - longer rotation by default
    severity: default
    # No engines listed = all engines inherit "default" severity

  # AppRole authentication example
  # Recommended for production - avoids long-lived static tokens
  # - name: approle-vault
  #   address: https://vault.prod.example.com:8200
  #   auth_method: approle
  #   # Store credentials securely in files (recommended for Kubernetes)
  #   role_id_file: /run/secrets/vault-role-id
  #   secret_id_file: /run/secrets/vault-secret-id
  #   # Or via environment variables
  #   # role_id_env: VAULT_ROLE_ID
  #   # secret_id_env: VAULT_SECRET_ID
  #   # Custom AppRole mount point (default: "approle")
  #   # approle_mount_point: my-approle
  #   namespace: admin/chronowarden
  #   verify_ssl: true
  #   severity: critical
