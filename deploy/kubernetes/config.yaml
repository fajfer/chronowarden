# Example: Kubernetes deployment with ConfigMap + Secret
#
# 1. Create this as a ConfigMap:
#      kubectl create configmap chronowarden-config --from-file=config.yaml=deploy/kubernetes/config.yaml
#
# 2. Create a Secret for the Vault tokens:
#      kubectl create secret generic chronowarden-vault-tokens \
#        --from-literal=VAULT_PROD_TOKEN=hvs.actual-production-token \
#        --from-literal=VAULT_STAGING_TOKEN=hvs.actual-staging-token
#
# 3. Create a Secret for custom CA certificates:
#      kubectl create secret generic chronowarden-ca-certs \
#        --from-file=root-ca.pem=path/to/root-ca.pem \
#        --from-file=intermediate-ca.pem=path/to/intermediate-ca.pem
#
# 4. Mount the ConfigMap, inject Secret as env vars, and mount certs in your Deployment:
#
#    spec:
#      containers:
#        - name: chronowarden
#          image: chronowarden:latest
#          envFrom:
#            - secretRef:
#                name: chronowarden-vault-tokens
#          env:
#            - name: CHRONOWARDEN_CONFIG
#              value: /etc/chronowarden/config.yaml
#          volumeMounts:
#            - name: config
#              mountPath: /etc/chronowarden
#              readOnly: true
#            - name: ca-certs
#              mountPath: /etc/chronowarden/certs
#              readOnly: true
#      volumes:
#        - name: config
#          configMap:
#            name: chronowarden-config
#        - name: ca-certs
#          secret:
#            secretName: chronowarden-ca-certs

# Global CA certificates directory
# All certificates in this directory will be automatically trusted
ca_certs_dir: /etc/chronowarden/certs

vaults:
  - name: production
    address: https://vault.production.example.com:8200
    token_env: VAULT_PROD_TOKEN
    namespace: app/chronowarden
    mount_path: secret
    verify_ssl: true

  - name: staging
    address: https://vault.staging.example.com:8200
    token_env: VAULT_STAGING_TOKEN
    mount_path: secret
    verify_ssl: true
