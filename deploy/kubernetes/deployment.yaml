---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronowarden
  namespace: chronowarden
  labels:
    app.kubernetes.io/name: chronowarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chronowarden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chronowarden
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: chronowarden
          image: ghcr.io/fajfer/chronowarden:main-dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: CHRONOWARDEN_CONFIG
              value: /etc/chronowarden/config.yaml
            # I had to do that to make frontend work on dev version with uvicorn
            # - name: PYTHONPATH
            #   value: /app:/app/.venv/lib/python3.12/site-packages
          volumeMounts:
            - name: config
              mountPath: /etc/chronowarden/config.yaml
              subPath: config.yaml
              readOnly: true
            # For custom certificates
            # - name: certs
            #   mountPath: /etc/chronowarden/certs
            #   readOnly: true
            - name: data
              mountPath: /app/data
          workingDir: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readonlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          secret:
            secretName: chronowarden-config
        - name: data
          persistentVolumeClaim:
            claimName: chronowarden-data
        # - name: certs
        #   secret:
        #     secretName: chronowarden-certs
      restartPolicy: Always
