# The config Secret deployment.yaml mounts. Copy it to config-secret.yaml, put your config under `config.yaml:`
# (the full reference is config.example.yaml), and use it with either:
#   kubectl apply -f config-secret.yaml  (or list it in kustomization.yaml)
#   podman kube play --publish 127.0.0.1:8000:8000 config-secret.yaml pvc.yaml deployment.yaml
# Keep the copy out of git: it holds credentials.
apiVersion: v1
kind: Secret
metadata:
  name: chronowarden-config
  namespace: chronowarden
  labels:
    app.kubernetes.io/name: chronowarden
stringData:
  config.yaml: |
    # Authentication (required). `none` makes everyone an admin: keep it for a local trial and switch to oidc or
    # proxy (see config.example.yaml and docs/guides/authentication.md) before anyone else can reach the port.
    auth:
      mode: none
    # auth:
    #   mode: oidc
    #   oidc:
    #     issuer: https://idp.example.com/realms/main
    #     client_id: chronowarden
    #     client_secret_file: /etc/chronowarden/oidc-client-secret
    #     redirect_uri: https://chronowarden.example.com/api/v1/auth/callback
    #   roles:
    #     admin: [chronowarden-admins]
    #     owner: [platform-teams]
    #     viewer: [auditors]

    # Prometheus metrics at /api/v1/metrics (off by default)
    # metrics:
    #   enabled: true

    # Custom CA certificates (mount them as in deployment.yaml's commented `certs` volume)
    # ca_certs_dir: /etc/chronowarden/certs

    # API only (no UI, no PDF reports): use the headless image, ghcr.io/fajfer/chronowarden:v0.10.0-headless

    # Your vaults: see config.example.yaml. A credential read from a file (token_file, role_id_file,
    # secret_id_file) must be mounted too, e.g. as another key of this Secret mounted like config.yaml.
    vaults: []
