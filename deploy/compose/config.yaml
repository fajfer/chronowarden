# Example: Docker/Podman Compose deployment
#
# Usage with compose.yaml:
#
#   services:
#     chronowarden:
#       image: chronowarden:latest
#       environment:
#         CHRONOWARDEN_CONFIG: /etc/chronowarden/config.yaml
#         VAULT_TOKEN: hvs.your-vault-token
#         CHRONOWARDEN_THEME: bison  # optional default UI theme (or `ui.default_theme` below)
#       volumes:
#         - ./deploy/compose/config.yaml:/etc/chronowarden/config.yaml:ro
#         - ./certs:/etc/chronowarden/certs:ro  # Mount custom CA certificates
#
# API only (no UI, no PDF reports): use the headless image, e.g. ghcr.io/fajfer/chronowarden:v0.8.0-headless.
# One sync and exit, e.g. from cron: `docker compose run --rm --entrypoint python chronowarden -m chronowarden sync`
# (set `polling_interval: off` below if nothing else should sync on a schedule).

# Authentication (required). `none` makes everyone an admin: keep it for a local trial and switch to oidc or proxy
# (see config.example.yaml and docs/guides/authentication.md) before anyone else can reach the port.
auth:
  mode: none
# auth:
#   mode: oidc
#   oidc:
#     issuer: https://idp.example.com/realms/main
#     client_id: chronowarden
#     client_secret_env: CHRONOWARDEN_OIDC_CLIENT_SECRET
#     redirect_uri: https://chronowarden.example.com/api/v1/auth/callback
#   roles:
#     admin: [chronowarden-admins]
#     owner: [platform-teams]
#     viewer: [auditors]

# Prometheus metrics at /api/v1/metrics (off by default; uncomment to let Prometheus scrape them)
# metrics:
#   enabled: true

# Global CA certificates directory (uncomment for production with custom certs)
# ca_certs_dir: /etc/chronowarden/certs

vaults:
  - name: vault
    address: http://vault:8200
    token_env: VAULT_TOKEN
    mount_path: secret
    verify_ssl: false
