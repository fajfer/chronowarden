# Example: Docker/Podman Compose deployment
#
# Usage with compose.yaml:
#
#   services:
#     chronowarden:
#       image: chronowarden:latest
#       environment:
#         CHRONOWARDEN_CONFIG: /etc/chronowarden/config.yaml
#         VAULT_TOKEN: hvs.your-vault-token
#       volumes:
#         - ./deploy/compose/config.yaml:/etc/chronowarden/config.yaml:ro
#         - ./certs:/etc/chronowarden/certs:ro  # Mount custom CA certificates

# Global CA certificates directory (uncomment for production with custom certs)
# ca_certs_dir: /etc/chronowarden/certs

vaults:
  - name: vault
    address: http://vault:8200
    token_env: VAULT_TOKEN
    mount_path: secret
    verify_ssl: false
