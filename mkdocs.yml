site_name: Chronowarden Docs
site_description: Secret lifecycle observability service tracking Vault TTLs and rotation metadata.
site_url: https://fajfer.github.io/chronowarden/
repo_url: https://github.com/fajfer/chronowarden
repo_name: fajfer/chronowarden

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - attr_list

nav:
  - Overview: index.md
  - Getting Started:
      - Quickstart: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Guides:
      - Upgrading to 0.7: guides/upgrading-to-0.7.md
      - Authentication: guides/authentication.md
      - Systems and owners: guides/systems-and-owners.md
      - Secrets deleted in Vault: guides/removed-secrets.md
      - Audit log: guides/audit-log.md
      - Rotation confirmation: guides/rotation-confirmation.md
      - Compliance evidence: guides/compliance-evidence.md
      - Compliance policies and reports: guides/compliance-policies.md
      - Example policies: guides/example-policies.md
      - Webhook alerts: guides/webhooks.md
      - Prometheus metrics: guides/metrics.md
  - Reference:
      - Vault Permissions: reference/vault-permissions.md