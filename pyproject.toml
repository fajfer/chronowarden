[project]
name = "chronowarden"
version = "0.7.3"
description = "Cloud-native secret expiration monitoring service"
readme = "README.md"
requires-python = ">=3.12"
license = "EUPL-1.2"
authors = [
    { name = "Damian Fajfer", email = "damian@fajfer.org" }
]
dependencies = [
    "fastapi>=0.115.0",
    "hvac>=2.3.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "prometheus-client>=0.21.0",
    "requests>=2.32.0",
    "urllib3>=2.8.0",  # pinned above requests' floor for PYSEC-2026-4175/4176/4177
    "sentry-sdk>=2.63.0",
    "typst>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "testcontainers>=4.10",
    "pypdf>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chronowarden"]

[tool.pytest.ini_options]
# Integration tests start real OpenBao/Vault containers (testcontainers); run them with: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: needs a container runtime; starts OpenBao and HashiCorp Vault",
    "cooldowns: keep the manual sync and snapshot cooldowns on (tests/conftest.py turns them off)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 120
target-version = ["py312"]
