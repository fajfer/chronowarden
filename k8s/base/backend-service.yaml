apiVersion: v1
kind: Service
metadata:
  name: chronowarden-backend
  namespace: chronowarden
  labels:
    app.kubernetes.io/name: chronowarden-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: chronowarden
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: chronowarden-backend
    app.kubernetes.io/component: backend
