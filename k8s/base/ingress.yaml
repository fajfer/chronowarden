apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chronowarden-ingress
  namespace: chronowarden
  labels:
    app.kubernetes.io/name: chronowarden
    app.kubernetes.io/part-of: chronowarden
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: chronowarden.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: chronowarden-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chronowarden-frontend
                port:
                  number: 8080
