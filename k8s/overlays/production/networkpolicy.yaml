apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chronowarden-backend-netpol
  namespace: chronowarden-prod
  labels:
    app.kubernetes.io/name: chronowarden-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: chronowarden
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chronowarden-backend
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from frontend and ingress controller
    # NOTE: Update the namespaceSelector labels to match your ingress controller's namespace labels
    # For nginx-ingress-controller: app.kubernetes.io/name: ingress-nginx
    # For traefik: app.kubernetes.io/name: traefik
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chronowarden-frontend
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow outbound HTTPS for HashiCorp Vault connectivity
    # IMPORTANT: Replace the placeholder CIDR with your Vault server's actual IP
    # Example for a Vault server at 10.0.1.50:
    #   cidr: 10.0.1.50/32
    # Without proper configuration, Vault integration will not work
    - to:
        - ipBlock:
            cidr: 127.0.0.1/32  # Placeholder - replace with actual Vault server IP
      ports:
        - protocol: TCP
          port: 8200  # HashiCorp Vault
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chronowarden-frontend-netpol
  namespace: chronowarden-prod
  labels:
    app.kubernetes.io/name: chronowarden-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: chronowarden
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chronowarden-frontend
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controller
    # NOTE: Update the namespaceSelector labels to match your ingress controller's namespace labels
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow traffic to backend
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chronowarden-backend
      ports:
        - protocol: TCP
          port: 8000
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
