name: Container images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  docker-build:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature of release images
    outputs:
      digest: ${{ steps.push-production.outputs.digest }}
      headless_digest: ${{ steps.push-headless.outputs.digest }}
    # buildah has no layer cache across runs and builds arm64 under emulation (ADR-031): slower than Buildx was
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install arm64 emulation
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static
          buildah --version
          podman --version

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | buildah login --username "$GITHUB_ACTOR" --password-stdin ghcr.io

      - name: Image labels
        env:
          DESCRIPTION: ${{ github.event.repository.description }}
        run: |
          # The OCI labels docker/metadata-action used to set, one --label per line for the builds below
          {
            echo "--label=org.opencontainers.image.title=${GITHUB_REPOSITORY#*/}"
            echo "--label=org.opencontainers.image.description=${DESCRIPTION}"
            echo "--label=org.opencontainers.image.version=${IMAGE_TAG}"
            echo "--label=org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "--label=org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--label=org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "--label=org.opencontainers.image.url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "--label=org.opencontainers.image.licenses=EUPL-1.2"
          } > "$RUNNER_TEMP/labels"

      - name: Build production image for smoke test
        run: buildah build --layers --platform linux/amd64 --target production -t localhost/chronowarden:smoke-test -f Containerfile .

      - name: Smoke test production image
        run: |
          printf 'vaults: []\nauth:\n  mode: none\n' > "$RUNNER_TEMP/config.yaml"
          podman run -d --name smoke -p 127.0.0.1:8000:8000 \
            -v "$RUNNER_TEMP/config.yaml:/data/config.yaml:ro" localhost/chronowarden:smoke-test
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8000/api/v1/health; then
            echo "::error::production image did not become healthy within 30s"
            podman logs smoke
            exit 1
          fi
          # Path traversal regression: the SPA catch-all must never serve files outside the build directory
          if curl -s --path-as-is "http://127.0.0.1:8000/..%2f..%2f..%2fetc%2fpasswd" | grep -q '^root:'; then
            echo "::error::path traversal: /etc/passwd was served"
            exit 1
          fi
          # Typst renders a PDF/A report inside the distroless image (ADR-020)
          id=$(curl -fsS -X POST -H 'Content-Type: application/json' -d '{"label":"smoke"}' \
            http://127.0.0.1:8000/api/v1/compliance/snapshots | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS -o "$RUNNER_TEMP/report.pdf" "http://127.0.0.1:8000/api/v1/compliance/snapshots/${id}/report.pdf"
          if ! head -c 5 "$RUNNER_TEMP/report.pdf" | grep -q '%PDF-' || ! grep -aq 'pdfaid:part' "$RUNNER_TEMP/report.pdf"; then
            echo "::error::the production image did not render a PDF/A report"
            podman logs smoke
            exit 1
          fi
          podman rm -f smoke

      - name: Build and push (production target)
        id: push-production
        run: |
          mapfile -t labels < "$RUNNER_TEMP/labels"
          buildah build --layers --platform linux/amd64,linux/arm64 --target production --manifest production \
            "${labels[@]}" -f Containerfile .
          if [ "$PUSH" = true ]; then
            buildah manifest push --all --format oci --digestfile "$RUNNER_TEMP/production.digest" \
              production "docker://${IMAGE}:${IMAGE_TAG}"
            echo "digest=$(cat "$RUNNER_TEMP/production.digest")" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR for cosign
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Sign the production image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.push-production.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Build and push (dev target)
        run: |
          mapfile -t labels < "$RUNNER_TEMP/labels"
          buildah build --layers --platform linux/amd64,linux/arm64 --target dev --manifest dev \
            "${labels[@]}" -f Containerfile .
          if [ "$PUSH" = true ]; then
            buildah manifest push --all --format oci dev "docker://${IMAGE}:${IMAGE_TAG}-dev"
          fi

      - name: Build headless image for smoke test
        run: buildah build --layers --platform linux/amd64 --target headless -t localhost/chronowarden:smoke-headless -f Containerfile .

      - name: Smoke test headless image
        run: |
          podman run -d --name smoke-headless -p 127.0.0.1:8001:8000 \
            -v "$RUNNER_TEMP/config.yaml:/data/config.yaml:ro" localhost/chronowarden:smoke-headless
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8001/api/v1/health && break
            sleep 1
          done
          fail() { echo "::error::headless image: $1"; podman logs smoke-headless; exit 1; }
          curl -fsS http://127.0.0.1:8001/api/v1/health > /dev/null || fail "not healthy within 30s"
          # ADR-024: no UI, no Typst; the report route stays and answers 501
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/)" = 404 ] || fail "/ is not 404"
          id=$(curl -fsS -X POST -H 'Content-Type: application/json' -d '{"label":"smoke"}' \
            http://127.0.0.1:8001/api/v1/compliance/snapshots | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8001/api/v1/compliance/snapshots/${id}/report.pdf")
          [ "$code" = 501 ] || fail "report.pdf answered $code, not 501"
          podman rm -f smoke-headless

      - name: Build and push (headless target)
        id: push-headless
        run: |
          mapfile -t labels < "$RUNNER_TEMP/labels"
          buildah build --layers --platform linux/amd64,linux/arm64 --target headless --manifest headless \
            "${labels[@]}" -f Containerfile .
          if [ "$PUSH" = true ]; then
            buildah manifest push --all --format oci --digestfile "$RUNNER_TEMP/headless.digest" \
              headless "docker://${IMAGE}:${IMAGE_TAG}-headless"
            echo "digest=$(cat "$RUNNER_TEMP/headless.digest")" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign the headless image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.push-headless.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  provenance:
    name: SLSA provenance for the ${{ matrix.variant }} image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker-build
    strategy:
      matrix:
        variant: [production, headless]
    permissions:
      actions: read # to read the workflow run
      id-token: write # to sign the provenance
      packages: write # to push the provenance to GHCR
    # Reusable workflows must be referenced by tag for the SLSA verifier to trust them (ADR-018)
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      image: ghcr.io/${{ github.repository }}
      digest: ${{ matrix.variant == 'headless' && needs.docker-build.outputs.headless_digest || needs.docker-build.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: SBOMs for the ${{ matrix.variant }} image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker-build
    strategy:
      matrix:
        variant: [production, headless]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # to upload the SBOMs and VEX to the release
      packages: write # to push the attestations
      id-token: write # keyless cosign attestations
    env:
      IMAGE: ghcr.io/${{ github.repository }}@${{ matrix.variant == 'headless' && needs.docker-build.outputs.headless_digest || needs.docker-build.outputs.digest }}
      # The production SBOMs keep their names from earlier releases
      PREFIX: ${{ matrix.variant == 'headless' && 'chronowarden-headless-image' || 'chronowarden-image' }}
      SYFT_FILE_METADATA_SELECTION: none
    steps:
      - name: Checkout repository
        # For the VEX statements and scripts/vex.py
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        # cosign writes the Docker-format config that syft reads too
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Generate image SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          for arch in amd64 arm64; do
            "$SYFT" scan "registry:${IMAGE}" --platform "linux/${arch}" --quiet \
              -o "cyclonedx-json@1.6=${PREFIX}-${arch}.cdx.json" \
              -o "spdx-json@3.0=${PREFIX}-${arch}.spdx.json"
            jq -e '.specVersion == "1.6"' "${PREFIX}-${arch}.cdx.json" > /dev/null
            jq -e '."@context" == "https://spdx.org/rdf/3.0.1/spdx-context.jsonld" and any(."@graph"[]; .type == "CreationInfo" and .specVersion == "3.0.1")' "${PREFIX}-${arch}.spdx.json" > /dev/null
            # Our not-affected statements, pointed at this SBOM's components (ADR-030)
            python3 scripts/vex.py "${PREFIX}-${arch}.cdx.json" vex/chronowarden.vex.cdx.json "${PREFIX}-${arch}.vex.cdx.json"
          done

      - name: Attest the SBOMs and VEX to the image
        run: |
          for arch in amd64 arm64; do  # named per arch: a *.cdx.json glob would also match the VEX
            cosign attest --yes --type cyclonedx --predicate "${PREFIX}-${arch}.cdx.json" "$IMAGE"
            cosign attest --yes --type https://spdx.dev/Document/v3 --predicate "${PREFIX}-${arch}.spdx.json" "$IMAGE"
            cosign attest --yes --type https://cyclonedx.org/vex --predicate "${PREFIX}-${arch}.vex.cdx.json" "$IMAGE"
          done

      - name: Upload the SBOMs and VEX to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release.yaml creates the release in parallel; wait up to 15 minutes for it
          for _ in $(seq 1 30); do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" "${PREFIX}"-*.json --repo "$GITHUB_REPOSITORY" --clobber
