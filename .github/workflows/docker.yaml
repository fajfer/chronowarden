name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build production image for smoke test
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          load: true
          tags: chronowarden:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test production container
        run: |
          docker run -d --name smoke-test -p 8000:8000 chronowarden:smoke-test
          echo "Waiting for container to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health 2>/dev/null; then
              echo ""
              echo "Health check passed!"
              docker rm -f smoke-test
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed after 30 seconds"
          echo "--- Last curl attempt ---"
          curl -v http://localhost:8000/api/v1/health || true
          echo "--- Container logs ---"
          docker logs smoke-test
          docker rm -f smoke-test
          exit 1

      - name: Build and push (production target)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (dev target)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          target: dev
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-dev
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
