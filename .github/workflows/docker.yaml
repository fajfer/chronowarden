name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  docker-build:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature of release images
    outputs:
      digest: ${{ steps.push-production.outputs.digest }}
    # A normal run takes ~6 minutes; fail fast instead of hanging for GitHub's 6-hour default
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build production image for smoke test
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          load: true
          tags: chronowarden:smoke-test
          platforms: linux/amd64
          cache-from: type=gha

      - name: Smoke test production image
        run: |
          printf 'vaults: []\n' > "$RUNNER_TEMP/config.yaml"
          docker run -d --name smoke -p 127.0.0.1:8000:8000 \
            -v "$RUNNER_TEMP/config.yaml:/data/config.yaml:ro" chronowarden:smoke-test
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8000/api/v1/health; then
            echo "::error::production image did not become healthy within 30s"
            docker logs smoke
            exit 1
          fi
          # Path traversal regression: the SPA catch-all must never serve files outside the build directory
          if curl -s --path-as-is "http://127.0.0.1:8000/..%2f..%2f..%2fetc%2fpasswd" | grep -q '^root:'; then
            echo "::error::path traversal: /etc/passwd was served"
            exit 1
          fi
          docker rm -f smoke

      - name: Build and push (production target)
        id: push-production
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the production image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.push-production.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"

      - name: Build and push (dev target)
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          target: dev
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}-dev
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  provenance:
    name: SLSA provenance for the production image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker-build
    permissions:
      actions: read # to read the workflow run
      id-token: write # to sign the provenance
      packages: write # to push the provenance to GHCR
    # Reusable workflows must be referenced by tag for the SLSA verifier to trust them (ADR-018)
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      image: ghcr.io/${{ github.repository }}
      digest: ${{ needs.docker-build.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
