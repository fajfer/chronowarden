name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13.5"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run black --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  integration:
    name: Integration tests (OpenBao, Vault)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13.5"

      - name: Install dependencies
        run: uv sync --locked

      - name: Use slirp4netns for rootless podman
        # Ubuntu's AppArmor profile for pasta, podman's default rootless network, stops podman from ending it, so
        # removing a container fails ("rootless netns: kill network process: permission denied")
        run: |
          command -v slirp4netns > /dev/null || { sudo apt-get update -q; sudo apt-get install -y -q slirp4netns; }
          printf '[network]\ndefault_rootless_network_cmd = "slirp4netns"\n' > "$RUNNER_TEMP/containers.conf"
          echo "CONTAINERS_CONF_OVERRIDE=$RUNNER_TEMP/containers.conf" >> "$GITHUB_ENV"

      - name: Start the podman API socket
        # testcontainers speaks the Docker API, which podman serves on this socket (ADR-032)
        run: |
          podman --version
          mkdir -p "$RUNNER_TEMP/podman"
          podman system service --time=0 "unix://$RUNNER_TEMP/podman/podman.sock" &
          for _ in $(seq 1 20); do [ -S "$RUNNER_TEMP/podman/podman.sock" ] && exit 0; sleep 0.5; done
          echo "::error::the podman socket didn't appear"; exit 1

      - name: Run against real OpenBao, HashiCorp Vault and Keycloak containers
        env:
          # Ryuk, testcontainers' reaper container, needs the Docker daemon's socket; the tests stop their own
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: DOCKER_HOST="unix://$RUNNER_TEMP/podman/podman.sock" uv run pytest -m integration

  frontend:
    name: Frontend type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check
