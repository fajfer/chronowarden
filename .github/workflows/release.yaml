name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  build:
    name: Build release files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13.5"
          # A release build must not restore a cache other workflow runs could have written (cache poisoning)
          enable-cache: false

      - name: Check the tag matches the package version
        run: |
          version=$(uv version --short)
          if [[ "${GITHUB_REF_NAME#v}" != "$version"* ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match pyproject.toml version $version"
            exit 1
          fi

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate source SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          # The frontend is a static build: its devDependencies (Svelte, ...) are compiled into what ships
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "true"
          SYFT_FILE_METADATA_SELECTION: none
        run: |
          "$SYFT" scan dir:. --exclude './dist/**' --exclude './.clusterfuzzlite/**' --quiet \
            -o cyclonedx-json@1.6=dist/chronowarden-source.cdx.json \
            -o spdx-json@3.0=dist/chronowarden-source.spdx.json
          jq -e '.specVersion == "1.6"' dist/chronowarden-source.cdx.json > /dev/null
          jq -e '."@context" == "https://spdx.org/rdf/3.0.1/spdx-context.jsonld" and any(."@graph"[]; .type == "CreationInfo" and .specVersion == "3.0.1")' dist/chronowarden-source.spdx.json > /dev/null

      - name: Generate the source VEX
        # Our not-affected statements, pointed at this SBOM's components (ADR-030)
        run: python3 scripts/vex.py dist/chronowarden-source.cdx.json vex/chronowarden.vex.cdx.json dist/chronowarden-source.vex.cdx.json

      - name: Hash release files
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"
          sha256sum -- * > SHA256SUMS

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  provenance:
    name: SLSA provenance
    needs: build
    permissions:
      actions: read # to read the workflow run
      id-token: write # to sign the provenance
      # The generator's upload job declares contents: write even with upload-assets off; GitHub refuses to start
      # a reusable workflow whose jobs ask for more than the caller grants (startup_failure on v0.7.0-rc.1)
      contents: write
    # Reusable workflows must be referenced by tag for the SLSA verifier to trust them (ADR-018)
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: chronowarden.intoto.jsonl

  release:
    name: Create GitHub Release
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Download provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release_notes.sh "$GITHUB_REF_NAME" > notes.md
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md "${prerelease[@]}"
