name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  build:
    name: Build release files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13.5"
          # A release build must not restore a cache other workflow runs could have written (cache poisoning)
          enable-cache: false

      - name: Check the tag matches the package version
        run: |
          version=$(uv version --short)
          if [[ "${GITHUB_REF_NAME#v}" != "$version"* ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match pyproject.toml version $version"
            exit 1
          fi

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate source SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          # The frontend is a static build: its devDependencies (Svelte, ...) are compiled into what ships
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "true"
          SYFT_FILE_METADATA_SELECTION: none
        run: |
          "$SYFT" scan dir:. --exclude './dist/**' --exclude './.clusterfuzzlite/**' --quiet \
            -o cyclonedx-json@1.6=dist/chronowarden-source.cdx.json \
            -o spdx-json@2.3=dist/chronowarden-source.spdx.json
          jq -e '.specVersion == "1.6"' dist/chronowarden-source.cdx.json > /dev/null
          jq -e '.spdxVersion == "SPDX-2.3"' dist/chronowarden-source.spdx.json > /dev/null

      - name: Hash release files
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"
          sha256sum -- * > SHA256SUMS

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  provenance:
    name: SLSA provenance
    needs: build
    permissions:
      actions: read # to read the workflow run
      id-token: write # to sign the provenance
      contents: read
    # Reusable workflows must be referenced by tag for the SLSA verifier to trust them (ADR-018)
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: chronowarden.intoto.jsonl

  release:
    name: Create GitHub Release
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Download provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release_notes.sh "$GITHUB_REF_NAME" > notes.md
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md "${prerelease[@]}"
