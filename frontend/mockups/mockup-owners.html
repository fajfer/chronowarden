<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronowarden — Owners</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

  <!-- Navbar -->
  <nav class="bg-gray-800 border-b border-gray-700 px-6 py-3 flex items-center justify-between">
    <span class="text-xl font-bold tracking-wide text-indigo-400">Chronowarden</span>
    <div class="flex items-center gap-4">
      <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded text-sm font-medium">Sync</button>
      <select class="bg-gray-700 border border-gray-600 text-gray-200 text-sm rounded px-3 py-1.5">
        <option>Admin</option>
        <option>Viewer</option>
      </select>
    </div>
  </nav>

  <div class="flex flex-1">
    <!-- Sidebar -->
    <aside class="w-56 bg-gray-800 border-r border-gray-700 p-4 space-y-1">
      <a href="#" class="block px-3 py-2 rounded text-gray-300 hover:bg-gray-700 text-sm">Dashboard</a>
      <a href="#" class="block px-3 py-2 rounded text-gray-300 hover:bg-gray-700 text-sm">Secrets</a>
      <a href="#" class="block px-3 py-2 rounded text-gray-300 hover:bg-gray-700 text-sm">Vaults</a>
      <a href="#" class="block px-3 py-2 rounded text-gray-300 hover:bg-gray-700 text-sm">Sync History</a>
      <a href="#" class="block px-3 py-2 rounded bg-gray-700 text-white font-medium text-sm">Settings</a>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 space-y-6">
      <h1 class="text-2xl font-semibold">Settings</h1>

      <!-- Tabs -->
      <div class="flex border-b border-gray-700">
        <button class="px-4 py-2 text-sm text-gray-400 hover:text-white border-b-2 border-transparent">General</button>
        <button class="px-4 py-2 text-sm text-white font-medium border-b-2 border-indigo-500">Owners</button>
      </div>

      <!-- Header Row -->
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold">Owner Management</h2>
        <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded text-sm font-medium">Create Owner</button>
      </div>

      <!-- Owners Table -->
      <div class="bg-gray-800 border border-gray-700 rounded-lg overflow-hidden">
        <table class="w-full text-sm text-left">
          <thead class="text-gray-400 uppercase text-xs border-b border-gray-700">
            <tr>
              <th class="px-4 py-3">Name</th>
              <th class="px-4 py-3">Email</th>
              <th class="px-4 py-3">Routes</th>
              <th class="px-4 py-3">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-700">
            <tr class="hover:bg-gray-750">
              <td class="px-4 py-3 font-medium text-white">platform-team</td>
              <td class="px-4 py-3 text-gray-300">platform@example.com</td>
              <td class="px-4 py-3 text-gray-300">2</td>
              <td class="px-4 py-3 flex gap-3">
                <button class="text-indigo-400 hover:text-indigo-300 text-xs">Edit</button>
                <button class="text-indigo-400 hover:text-indigo-300 text-xs">Test</button>
                <button class="text-red-400 hover:text-red-300 text-xs">Delete</button>
              </td>
            </tr>
            <tr class="hover:bg-gray-750">
              <td class="px-4 py-3 font-medium text-white">dba-team</td>
              <td class="px-4 py-3 text-gray-300">dba@example.com</td>
              <td class="px-4 py-3 text-gray-300">1</td>
              <td class="px-4 py-3 flex gap-3">
                <button class="text-indigo-400 hover:text-indigo-300 text-xs">Edit</button>
                <button class="text-indigo-400 hover:text-indigo-300 text-xs">Test</button>
                <button class="text-red-400 hover:text-red-300 text-xs">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

</body>
</html>
