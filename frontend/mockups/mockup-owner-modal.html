<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronowarden — Owner Modal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

  <!-- Dark Overlay -->
  <div class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50">

    <!-- Modal -->
    <div class="bg-gray-800 border border-gray-700 rounded-xl shadow-2xl w-full max-w-xl mx-4">

      <!-- Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-700">
        <h2 class="text-lg font-semibold text-white">Create Owner</h2>
        <button class="text-gray-400 hover:text-white text-xl leading-none">&times;</button>
      </div>

      <!-- Body -->
      <div class="px-6 py-5 space-y-5">

        <!-- Name -->
        <div>
          <label class="block text-sm text-gray-400 mb-1">Name</label>
          <input type="text" placeholder="e.g. platform-team"
                 class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-indigo-500" />
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm text-gray-400 mb-1">Email</label>
          <input type="email" placeholder="team@example.com"
                 class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-indigo-500" />
        </div>

        <!-- Notification Routes -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-medium text-white">Notification Routes</h3>
            <button class="bg-gray-700 hover:bg-gray-600 text-gray-300 px-3 py-1 rounded text-xs font-medium">Add Route</button>
          </div>

          <!-- Sample Route -->
          <div class="bg-gray-900 border border-gray-700 rounded-lg p-4 space-y-3">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs text-gray-400 mb-1">Type</label>
                <select class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-sm text-gray-200 focus:outline-none focus:border-indigo-500">
                  <option>Email</option>
                  <option>Webhook</option>
                </select>
              </div>
              <div>
                <label class="block text-xs text-gray-400 mb-1">Address</label>
                <input type="text" value="platform@example.com"
                       class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-sm text-gray-200 focus:outline-none focus:border-indigo-500" />
              </div>
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Message Template</label>
              <textarea rows="2"
                        class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-sm text-gray-200 focus:outline-none focus:border-indigo-500"
              >Secret {{ secret_name }} expires in {{ days }} days.</textarea>
            </div>
            <div class="flex items-center gap-3">
              <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded text-xs font-medium">Test Route</button>
              <button class="text-red-400 hover:text-red-300 text-xs">Remove</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-700">
        <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded text-sm font-medium">Save</button>
        <button class="bg-gray-700 hover:bg-gray-600 text-gray-200 px-4 py-1.5 rounded text-sm font-medium">Cancel</button>
      </div>
    </div>
  </div>

</body>
</html>
