# GitLab CI (ADR-033): the same checks as .github/workflows/ci.yaml and agents-docs.yaml, plus GitLab Ultimate's
# security scanners. Images are pinned by digest (ADR-033 §10: no workflow linter for GitLab CI yet).

workflow:
  rules:
    # One pipeline per change: MR pipelines for MRs, branch pipelines otherwise (the mirror's main, tags)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - build
  - dast
  - deploy

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - template: DAST.gitlab-ci.yml
  - template: API-Security.gitlab-ci.yml

variables:
  # The security templates skip merge request pipelines unless this is set; the approval policies need their reports
  AST_ENABLE_MR_PIPELINES: "true"
  GITLAB_ADVANCED_SAST_ENABLED: "true"
  # The released production image; GitLab scans it from ghcr (ADR-033 §7)
  CS_IMAGE: ghcr.io/fajfer/chronowarden:v0.10.0
  UV_PYTHON: "3.13.5"
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache

.uv:
  image: ghcr.io/astral-sh/uv:0.13.7-trixie-slim@sha256:f6da342fe598dc462a7e6f61e7b3bf7fc84e381467efbdf29ccc1d32f2fc68a4
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  before_script:
    - uv sync --locked

backend:
  extends: .uv
  stage: test
  before_script:
    # devenv/processes.py identifies its processes with ps, which the slim image lacks
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends procps > /dev/null
    - uv sync --locked
  script:
    - uv run black --check .
    - uv run ruff check --exit-zero --output-format=gitlab --output-file=gl-code-quality.json .
    - uv run ruff check .
    - uv run pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
      codequality: gl-code-quality.json

integration:
  extends: .uv
  stage: test
  timeout: 20m
  services:
    - name: docker:29-dind@sha256:08a98015fce594af7c382883bea080ea206de74402a95da9dc52b6428c8cd121
      alias: docker
  variables:
    # testcontainers talks to the dind service; the containers' ports are published on that host
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    - uv run pytest -m integration --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

frontend:
  stage: test
  image: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm]
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run check

agents-docs:
  stage: test
  image: python:3.13.17-slim@sha256:d98cc29d3266e535dd9da1099688d9cb3ca4753813571e071763d17725460962
  script:
    - python3 scripts/check_agents_docs.py

# The mkdocs site: checked on every branch, published to GitLab Pages from the default branch
docs:
  extends: .uv
  stage: test
  script:
    - uv run mkdocs build --strict -d public
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  extends: .uv
  stage: deploy
  script:
    - uv run mkdocs build --strict -d public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# DAST and API security testing attack the app built from this commit, running in the scan job with a dev OpenBao
# (auth: none, so the scanners reach every endpoint). The image goes to this project's registry under ci/.
build-image:
  stage: build
  image: docker:29-cli@sha256:2357639ad1ea7d0194134bf3292622fd4e562483966ed674e5d7c945b5f3b28d
  services:
    - name: docker:29-dind@sha256:08a98015fce594af7c382883bea080ea206de74402a95da9dc52b6428c8cd121
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
    - docker build --target production -t "$CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA"

.running-app:
  needs: [build-image]
  services:
    - name: quay.io/openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
      alias: openbao
      command: ["server", "-dev", "-dev-root-token-id=dast-root", "-dev-listen-address=0.0.0.0:8200"]
    - name: $CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA
      alias: chronowarden
      # The image has no shell: write the config from CW_SCAN_CONFIG, then start uvicorn as the entrypoint does
      entrypoint:
        - python
        - -c
        - >-
          import os, pathlib, runpy, sys;
          pathlib.Path("/tmp/chronowarden.yaml").write_text(os.environ["CW_SCAN_CONFIG"]);
          os.environ["CHRONOWARDEN_CONFIG"] = "/tmp/chronowarden.yaml";
          sys.argv = ["uvicorn", "chronowarden:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"];
          runpy.run_module("uvicorn", run_name="__main__", alter_sys=True)
  variables:
    VAULT_SCAN_TOKEN: dast-root
    CW_SCAN_CONFIG: |
      allowed_hosts: ["*"]
      auth:
        mode: none
      vaults:
        - name: scan-openbao
          address: http://openbao:8200
          token_env: VAULT_SCAN_TOKEN
          mount_path: secret
          verify_ssl: false
          auth_method: token

dast:
  extends: .running-app
  variables:
    DAST_TARGET_URL: http://chronowarden:8000
    DAST_FULL_SCAN: "true"
    DAST_TARGET_CHECK_TIMEOUT: "300"

api_security:
  extends: .running-app
  variables:
    APISEC_TARGET_URL: http://chronowarden:8000
    APISEC_OPENAPI: http://chronowarden:8000/openapi.json
    APISEC_PROFILE: Quick-10
